name: Test and publish Pocket Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test the city generator and drum machine
        run: node --test tests/*.test.mjs
      - name: Collect the static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir site
          cp -R index.html assets city beat site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
